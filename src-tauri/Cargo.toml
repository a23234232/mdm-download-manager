[package]
name = "mdm"
version = "0.1.0"
description = "MDM multi-protocol download manager"
authors = ["MDM"]
edition = "2021"

[lib]
name = "mdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
url = "2"
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
rand = "0.8"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["cors"] }
roxmltree = "0.20"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
